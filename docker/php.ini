; Buffer output so header('Location: ...') redirects still work if a warning is printed first
output_buffering = 4096
expose_php = Off
; Errors go to the log; includes/bootstrap.php shows them again when APP_DEBUG=1
display_errors = Off
display_startup_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
