services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-project_selector}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      APP_DEBUG: ${APP_DEBUG:-1}
    depends_on:
      db:
        condition: service_healthy

  db:
    # MariaDB rather than MySQL 8: the code queries the `groups` table unquoted,
    # and GROUPS is a reserved word in MySQL 8.
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-project_selector}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-app}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
