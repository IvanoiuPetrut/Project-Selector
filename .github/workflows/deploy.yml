name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ivanoiupetrut/project-selector
  APP_DIR: apps/project-selector

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to VPS
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$TARGET" "mkdir -p ~/$APP_DIR"
          scp deploy/compose.yml "$TARGET:$APP_DIR/compose.yml"
          # The schema and seed data the db container runs on its first start
          scp db/init.sql "$TARGET:$APP_DIR/init.sql"
          # The registry token goes in over stdin to a throwaway Docker config, so it never stays on the VPS
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "set -e
            export DOCKER_CONFIG=\$(mktemp -d) IMAGE_TAG=$GITHUB_SHA
            trap 'rm -rf \$DOCKER_CONFIG' EXIT
            docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd ~/$APP_DIR
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f"
