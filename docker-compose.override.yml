# Local development extras, applied automatically by `docker compose up`.
# For deployment, use only the base file: docker compose -f docker-compose.yml up -d
services:
  app:
    volumes:
      - ./:/var/www/html # live-edit PHP/CSS without rebuilding

  db:
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
